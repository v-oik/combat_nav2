controller_server:
  ros__parameters:
    use_sim_time: false
    publish_zero_velocity: true
    controller_frequency: 20.0
    transform_tolerance: 0.2
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.3

    # 🔥 끝판왕 제어기: MPPI Controller (저속 운용 모드)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000

      # 🔻 가속도 제한 (낮춤)
      ax_max: 1.0
      ax_min: -1.0
      ay_max: 0.0          # 차동 구동이므로 좌우 슬립은 0
      ay_min: 0.0
      az_max: 0.8
      az_min: -0.8

      # 🔻 샘플링 표준편차 (속도 줄였으니 탐색폭도 줄임)
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.25

      # 🔻 최고 속도 제한 (낮춤)
      vx_max: 0.2          # can raw 400 기준
      vx_min: -0.2         # can raw -400 기준
      vy_max: 0.0
      wz_max: 0.45         # can raw 400 기준

      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        cost_power: 1
        cost_weight: 3.8
        critical_cost: 300.0
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.2
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 7.0
        max_heuristic_cost: 0.15
        offset_from_furthest: 20
        trajectory_point_step: 4
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: true
      downsampling_factor: 2
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      use_final_approach_orientation: true
      cost_travel_multiplier: 1.0
      cost_penalty_multiplier: 1.2

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      always_send_full_costmap: true
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 1.0
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      transform_tolerance: 1.0
      footprint: "[ [0.66, 0.43], [0.66, -0.43], [-0.66, -0.43], [-0.66, 0.43] ]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_lidar
        front_lidar:
          topic: /rslidar_points
          data_type: "PointCloud2"
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 1.0
      rolling_window: false
      track_unknown_space: true
      transform_tolerance: 1.0
      footprint: "[ [0.66, 0.43], [0.66, -0.43], [-0.66, -0.43], [-0.66, 0.43] ]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: front_lidar
        front_lidar:
          topic: /rslidar_points
          data_type: "PointCloud2"
          obstacle_max_range: 8.0
          raytrace_max_range: 9.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        inflation_radius: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    max_velocity: [0.2, 0.0, 0.45]    # can raw 400 cap
    min_velocity: [-0.2, 0.0, -0.45] # can raw -400 cap
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.5]

bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_nav_to_pose_bt_xml: "/home/firefly/combat_nav2/src/combat_robot_nav2/include/single_plan_bt.xml"
    default_nav_through_poses_bt_xml: "/home/firefly/combat_nav2/src/combat_robot_nav2/include/way_plan_bt.xml"